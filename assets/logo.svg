<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c1f66"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="iri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f6bff"/>
      <stop offset="0.5" stop-color="#4dd6ff"/>
      <stop offset="1" stop-color="#ff5cc8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="256" rx="116" fill="url(#sheen)"/>
  <!-- the meeting window -->
  <rect x="96" y="120" width="320" height="236" rx="34" fill="#191333" stroke="url(#iri)" stroke-width="12"/>
  <!-- the bot: a calm round head with an antenna -->
  <line x1="256" y1="150" x2="256" y2="170" stroke="url(#iri)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="146" r="9" fill="#4dd6ff"/>
  <rect x="196" y="172" width="120" height="92" rx="30" fill="url(#iri)"/>
  <circle cx="232" cy="214" r="12" fill="#140f2a"/>
  <circle cx="280" cy="214" r="12" fill="#140f2a"/>
  <rect x="234" y="238" width="44" height="8" rx="4" fill="#140f2a"/>
  <!-- the transcript -->
  <rect x="140" y="290" width="232" height="14" rx="7" fill="#ffffff" opacity="0.9"/>
  <rect x="140" y="318" width="160" height="14" rx="7" fill="#ffffff" opacity="0.55"/>
  <!-- the call: a stand under the window -->
  <rect x="216" y="372" width="80" height="14" rx="7" fill="url(#iri)" opacity="0.8"/>
</svg>
